runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 10
  minInstances: 0
  concurrency: 80
  # Agent runs (drafter, reviewer, ideator) loop through multiple Anthropic
  # calls and tool executions. A typical drafter completes in 60-90s; complex
  # multi-turn loops can exceed that. The default 60s killed runs mid-flight
  # (route handler saw req.signal.aborted, marked agentRuns status=cancelled
  # with postIds=[]). 300s leaves headroom; max is 3600 on Cloud Run.
  timeoutSeconds: 300

env:
  # Lift Node's default ~2 GB old-space cap during install + build.
  # pnpm install + next build together exceed 2 GB on the App Hosting
  # buildpack VM and crash with "JavaScript heap out of memory" (OOM).
  - variable: NODE_OPTIONS
    value: --max-old-space-size=4096
    availability:
      - BUILD

  # Public origin - used by OAuth redirect_uri registration and by the
  # connect/callback routes to build user-facing redirects. Without this,
  # appBaseUrl() falls back to localhost and redirects leak Cloud Run's
  # internal 0.0.0.0:8080 listener address.
  - variable: APP_BASE_URL
    value: https://timbl.app
    availability:
      - BUILD
      - RUNTIME

  # Control centre host gate (proxy.ts) - requests on this host route to
  # /control, every other host 404s it.
  - variable: NEXT_PUBLIC_ADMIN_HOST
    value: admin.timbl.app
    availability:
      - BUILD
      - RUNTIME

  # Share the __session cookie across timbl.app + admin.timbl.app so one
  # sign-in covers both hosts (lib/auth/session.ts).
  - variable: NEXT_PUBLIC_COOKIE_DOMAIN
    value: .timbl.app
    availability:
      - BUILD
      - RUNTIME

  # ---------------------------------------------------------------------------
  # Public (NEXT_PUBLIC_*) - exposed to the browser bundle.
  # Available at BUILD time so Next inlines them into the client chunks.
  # ---------------------------------------------------------------------------
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: sm-dashboard-e7641
    availability:
      - BUILD
      - RUNTIME

  # Shown in the Google "continue to …" prompt. /__/auth rewrites in next.config.ts
  # still proxy handler assets from *.firebaseapp.com (FIREBASE_AUTH_PROXY_HOST).
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: timbl.app

  - variable: FIREBASE_AUTH_PROXY_HOST
    value: sm-dashboard-e7641.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: sm-dashboard-e7641.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME

  # PostHog product analytics. Host is a non-secret US-region URL (plaintext,
  # like the auth domain above). The project key is client-safe (phc_, ships in
  # the browser bundle), but we route it through Secret Manager to match the
  # firebase NEXT_PUBLIC_* convention. Both must be BUILD-available so Next
  # inlines them into the client chunks. The client posts to /ingest, which
  # next.config reverse-proxies to PostHog. Create + grant the secret once:
  #   gcloud secrets create NEXT_PUBLIC_POSTHOG_KEY --replication-policy=automatic
  #   printf '%s' "phc_..." | gcloud secrets versions add NEXT_PUBLIC_POSTHOG_KEY --data-file=-
  - variable: NEXT_PUBLIC_POSTHOG_HOST
    value: https://us.i.posthog.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_POSTHOG_KEY
    secret: NEXT_PUBLIC_POSTHOG_KEY
    availability:
      - BUILD
      - RUNTIME

  # ---------------------------------------------------------------------------
  # Server-only secrets - runtime only. Resolved from Google Secret Manager.
  # The App Hosting service account needs roles/secretmanager.secretAccessor
  # on each secret. Admin SDK credentials are inherited from the App Hosting
  # compute SA via ADC - no FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON binding
  # required.
  # ---------------------------------------------------------------------------
  - variable: AGENT_CRON_SECRET
    secret: AGENT_CRON_SECRET
    availability:
      - RUNTIME

  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  - variable: GOOGLE_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability:
      - RUNTIME

  # Single PLATFORM OpenRouter key - Timbl owns it, cost folded into the
  # subscription. Used by the openai-compatible adapter for provider=openrouter.
  # Create the secret + grant the App Hosting SA secretAccessor before deploy:
  #   gcloud secrets create OPENROUTER_API_KEY --replication-policy=automatic
  #   printf '%s' "$KEY" | gcloud secrets versions add OPENROUTER_API_KEY --data-file=-
  - variable: OPENROUTER_API_KEY
    secret: OPENROUTER_API_KEY
    availability:
      - RUNTIME

  # ---------------------------------------------------------------------------
  # Publishing layer - token vault key, worker HMAC, and per-platform OAuth
  # apps. Create each secret + grant the App Hosting SA secretAccessor once:
  #   gcloud secrets create SOCIAL_TOKEN_KEY --replication-policy=automatic
  #   printf '%s' "$(openssl rand -hex 32)" | gcloud secrets versions add SOCIAL_TOKEN_KEY --data-file=-
  #   gcloud secrets create PUBLISH_SWEEP_SECRET --replication-policy=automatic
  #   printf '%s' "$(openssl rand -hex 32)" | gcloud secrets versions add PUBLISH_SWEEP_SECRET --data-file=-
  #   # then LINKEDIN_/X_/META_ client id+secret from each platform's developer app.
  - variable: SOCIAL_TOKEN_KEY
    secret: SOCIAL_TOKEN_KEY
    availability:
      - RUNTIME

  - variable: PUBLISH_SWEEP_SECRET
    secret: PUBLISH_SWEEP_SECRET
    availability:
      - RUNTIME

  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
    availability:
      - RUNTIME

  # Until you verify a product domain in Resend, keep test mode on (no DNS).
  # Later: set RESEND_TEST_MODE=0 and bind RESEND_INVITE_FROM from Secret Manager.
  - variable: RESEND_TEST_MODE
    value: "1"
    availability:
      - RUNTIME

  # Platform OAuth app credentials (LinkedIn / X / Meta) are stored in
  # Firestore, AES-256-GCM-encrypted with SOCIAL_TOKEN_KEY, and managed
  # from /settings/channels by an org admin. No per-platform secret
  # bindings needed here - adding a platform = one dialog entry, not a
  # redeploy. See lib/publishing/oauth.ts → loadOauthApp().

  # SENTRY_DSN intentionally unbound - Sentry isn't set up. Cloud Logging
  # in App Hosting + Functions provides primary error visibility. Re-wire
  # when @sentry/nextjs lands.
